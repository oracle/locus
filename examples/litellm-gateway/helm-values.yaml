# LiteLLM AI Gateway — sample Kubernetes values for fronting providers.
#
# Pairs with the official LiteLLM Helm chart:
#   oci://ghcr.io/berriai/litellm-helm
#   https://github.com/BerriAI/litellm/tree/main/deploy/charts/litellm-helm
#
# Deploy with:
#
#   # 1. Create the provider credentials secret (the gateway pod uses
#   #    these for upstream calls). Prefer External Secrets in
#   #    production; the kubectl form below is for illustration only.
#   kubectl create namespace litellm
#   kubectl -n litellm create secret generic provider-credentials \
#     --from-literal=OPENAI_API_KEY="sk-..." \
#     --from-literal=ANTHROPIC_API_KEY="sk-ant-..."
#
#   # 2. Master key for /key/generate. Treat as a high-value secret.
#   kubectl -n litellm create secret generic litellm-master \
#     --from-literal=LITELLM_MASTER_KEY="$(openssl rand -hex 32)"
#
#   # 3. Credentials of the external Postgres named under ``db`` below.
#   kubectl -n litellm create secret generic litellm-db \
#     --from-literal=username=litellm --from-literal=password="..."
#
#   # 4. Install / upgrade the chart, mounting config.yaml from this
#   #    directory as the gateway's config.
#   helm -n litellm upgrade --install gateway oci://ghcr.io/berriai/litellm-helm \
#     --values examples/litellm-gateway/helm-values.yaml \
#     --set-file proxy_config=examples/litellm-gateway/config.yaml
#
# Locus services in the same cluster then point at:
#   http://gateway-litellm.litellm.svc.cluster.local:4000
#
# For the response cache and the OpenTelemetry callback, mount
# config.platform.yaml instead and add a Secret with REDIS_URL and
# OTEL_EXPORTER_OTLP_ENDPOINT to ``environmentSecrets``.
#
# Both ``helm lint`` and ``helm template`` pass with these values
# (chart 1.109.1); an install on a cluster is not something the Locus
# maintainers have verified — docs/how-to/litellm-gateway.md has the
# sequence to do so.

# ---------------------------------------------------------------------------
# Image / replicas
# ---------------------------------------------------------------------------
image:
  repository: ghcr.io/berriai/litellm
  tag: main-stable
  pullPolicy: IfNotPresent

replicaCount: 2

# ---------------------------------------------------------------------------
# Inline config — pass the contents of config.yaml (or
# config.platform.yaml) with --set-file, as above; the chart puts it in a
# ConfigMap mounted at /etc/litellm/config.yaml.
# ---------------------------------------------------------------------------
# proxy_config: |
#   model_list:
#     - model_name: gpt-4o
#       litellm_params:
#         model: openai/gpt-4o
#         …

# ---------------------------------------------------------------------------
# Environment — provider credentials + master key sourced from secrets.
# The chart exports every key of each listed Secret as an environment
# variable, which config.yaml reads via os.environ/<NAME>.
# ---------------------------------------------------------------------------
environmentSecrets:
- provider-credentials
- litellm-master

# The chart's own PROXY_MASTER_KEY, read from the same secret so the
# migration job and the gateway agree on the admin key.
masterkeySecretName: litellm-master
masterkeySecretKey: LITELLM_MASTER_KEY

# ---------------------------------------------------------------------------
# Resources — sized for a small platform tier. Adjust to traffic.
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# ---------------------------------------------------------------------------
# Service — cluster-internal only. The gateway issues virtual keys and
# carries upstream provider credentials; do NOT expose it via a
# LoadBalancer. Use an in-cluster Ingress + mTLS / OAuth2 proxy if you
# need it reachable from other namespaces / clusters.
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 4000

# ---------------------------------------------------------------------------
# Postgres — required for persistent virtual keys + spend logs in
# production. ``deployStandalone: false`` keeps the chart from bundling
# its own Postgres; the gateway connects to the external instance named
# here with the credentials in the ``litellm-db`` Secret.
# ---------------------------------------------------------------------------
db:
  useExisting: true
  deployStandalone: false
  endpoint: postgres.your-platform.svc.cluster.local
  database: litellm
  secret:
    name: litellm-db
    usernameKey: username
    passwordKey: password

# ---------------------------------------------------------------------------
# Service account — bind to a workload identity / IRSA-style principal
# if your platform supports keyless cloud auth.
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: litellm-gateway

# ---------------------------------------------------------------------------
# Pod hardening
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
