# LiteLLM AI Gateway — sample OKE / Kubernetes values for fronting OCI.
#
# Pairs with the official LiteLLM Helm chart:
#   ghcr.io/berriai/litellm-helm
#   https://github.com/BerriAI/litellm/tree/main/deploy/charts/litellm-helm
#
# Deploy with:
#
#   # 1. Create the OCI credentials secret (the gateway pod uses these
#   #    to sign upstream OCI calls). Prefer External Secrets / OCI Vault
#   #    in production; the kubectl form below is for illustration only.
#   kubectl create namespace litellm
#   kubectl -n litellm create secret generic oci-credentials \
#     --from-literal=OCI_REGION="us-chicago-1" \
#     --from-literal=OCI_USER="ocid1.user.oc1..xxx" \
#     --from-literal=OCI_FINGERPRINT="aa:bb:cc:..." \
#     --from-literal=OCI_TENANCY="ocid1.tenancy.oc1..xxx" \
#     --from-literal=OCI_COMPARTMENT_ID="ocid1.compartment.oc1..xxx" \
#     --from-file=OCI_KEY_FILE=/path/to/api_key.pem
#
#   # 2. Master key for /key/generate. Treat as a high-value secret.
#   kubectl -n litellm create secret generic litellm-master \
#     --from-literal=LITELLM_MASTER_KEY="$(openssl rand -hex 32)"
#
#   # 3. Install / upgrade the chart.
#   helm repo add litellm oci://ghcr.io/berriai/litellm-helm
#   helm -n litellm upgrade --install gateway litellm/litellm \
#     --values examples/litellm-gateway/helm-values.yaml
#
# Locus services in the same cluster then point at:
#   http://gateway-litellm.litellm.svc.cluster.local:4000

# ---------------------------------------------------------------------------
# Image / replicas
# ---------------------------------------------------------------------------
image:
  repository: ghcr.io/berriai/litellm
  tag: main-stable
  pullPolicy: IfNotPresent

replicaCount: 2

# ---------------------------------------------------------------------------
# Inline config — alternatively mount the contents of config.yaml from
# this directory via a ConfigMap. The Helm chart accepts either.
# ---------------------------------------------------------------------------
# Set proxy_config to the contents of config.yaml. When using --set-file
# you can reference the sibling file directly:
#   --set-file proxy_config=examples/litellm-gateway/config.yaml
# proxy_config: |
#   model_list:
#     - model_name: oci-cohere-command
#       litellm_params:
#         model: oci/cohere.command-latest
#         …

# ---------------------------------------------------------------------------
# Environment — OCI credentials + master key sourced from secrets.
# ---------------------------------------------------------------------------
envFrom:
- secretRef:
    name: oci-credentials
- secretRef:
    name: litellm-master

# ---------------------------------------------------------------------------
# Resources — sized for a small platform tier. Adjust to traffic.
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# ---------------------------------------------------------------------------
# Service — cluster-internal only. The gateway issues virtual keys and
# carries OCI signing material; do NOT expose it via a LoadBalancer.
# Use an in-cluster Ingress + mTLS / OAuth2 proxy if you need it reachable
# from other namespaces / clusters.
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 4000

# ---------------------------------------------------------------------------
# Postgres — required for persistent virtual keys + spend logs in
# production. The chart bundles an option to provision it; the form
# below points at an external Postgres (e.g. an OCI ADB instance).
# ---------------------------------------------------------------------------
db:
  useExisting: true
  endpoint: postgres.your-platform.svc.cluster.local:5432
  database: litellm
  url: postgresql://litellm:$(POSTGRES_PASSWORD)@$(DB_HOST)/$(DB_DATABASE)
  secret:
    name: litellm-db
    usernameKey: username
    passwordKey: password

# ---------------------------------------------------------------------------
# OKE Workload Identity — when set, the gateway pod assumes an OCI
# IAM workload identity and OCI signing keys never have to land on
# disk. Configure the OCI principal in your IAM policy and uncomment
# below; remove the OCI_KEY / OCI_USER / OCI_FINGERPRINT entries from
# the oci-credentials Secret in that case.
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: litellm-gateway
  # annotations:
  #   oraclecloud.com/workload-identity: "<your-principal-ocid>"

# ---------------------------------------------------------------------------
# Pod hardening
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
