# LiteLLM AI Gateway — sample config for fronting Oracle Generative AI.
#
# Used by docker-compose.yml in this directory. Stand the gateway up with:
#
#   cd examples/litellm-gateway/
#   docker compose up
#
# The gateway picks up OCI credentials from the env vars exported into the
# container by docker-compose.yml. See docs/how-to/litellm-gateway.md.

model_list:
  # ---------------------------------------------------------------------------
  # OCI Generative AI Infrastructure — native API (/20231130/actions/chat).
  # LiteLLM handles the OCI Signature v1 RSA-SHA256 signing internally.
  # ---------------------------------------------------------------------------

- model_name: oci-cohere-command
  litellm_params:
    model: oci/cohere.command-latest
    oci_region: os.environ/OCI_REGION
    oci_user: os.environ/OCI_USER
    oci_fingerprint: os.environ/OCI_FINGERPRINT
    oci_tenancy: os.environ/OCI_TENANCY
    oci_key_file: os.environ/OCI_KEY_FILE
    oci_compartment_id: os.environ/OCI_COMPARTMENT_ID

- model_name: oci-grok
  litellm_params:
    model: oci/xai.grok-4.20
    oci_region: os.environ/OCI_REGION
    oci_user: os.environ/OCI_USER
    oci_fingerprint: os.environ/OCI_FINGERPRINT
    oci_tenancy: os.environ/OCI_TENANCY
    oci_key_file: os.environ/OCI_KEY_FILE
    oci_compartment_id: os.environ/OCI_COMPARTMENT_ID

- model_name: oci-gpt5-mini
  litellm_params:
    model: oci/openai.gpt-5-mini
    oci_region: os.environ/OCI_REGION
    oci_user: os.environ/OCI_USER
    oci_fingerprint: os.environ/OCI_FINGERPRINT
    oci_tenancy: os.environ/OCI_TENANCY
    oci_key_file: os.environ/OCI_KEY_FILE
    oci_compartment_id: os.environ/OCI_COMPARTMENT_ID

- model_name: oci-llama-4-maverick
  litellm_params:
    model: oci/meta.llama-4-maverick-17b-128e-instruct-fp8
    oci_region: os.environ/OCI_REGION
    oci_user: os.environ/OCI_USER
    oci_fingerprint: os.environ/OCI_FINGERPRINT
    oci_tenancy: os.environ/OCI_TENANCY
    oci_key_file: os.environ/OCI_KEY_FILE
    oci_compartment_id: os.environ/OCI_COMPARTMENT_ID

- model_name: oci-gemini-2.5-flash
  litellm_params:
    model: oci/google.gemini-2.5-flash
    oci_region: os.environ/OCI_REGION
    oci_user: os.environ/OCI_USER
    oci_fingerprint: os.environ/OCI_FINGERPRINT
    oci_tenancy: os.environ/OCI_TENANCY
    oci_key_file: os.environ/OCI_KEY_FILE
    oci_compartment_id: os.environ/OCI_COMPARTMENT_ID

- model_name: oci-cohere-embed
  litellm_params:
    model: oci/cohere.embed-v4.0
    oci_region: os.environ/OCI_REGION
    oci_user: os.environ/OCI_USER
    oci_fingerprint: os.environ/OCI_FINGERPRINT
    oci_tenancy: os.environ/OCI_TENANCY
    oci_key_file: os.environ/OCI_KEY_FILE
    oci_compartment_id: os.environ/OCI_COMPARTMENT_ID


# Fallback chains across the OCI model catalog. If oci-gpt5-mini returns
# a 5xx / rate-limit error, the gateway transparently retries against
# oci-grok, then oci-cohere-command. The agent never sees the upstream
# failure — only the eventual successful response.
router_settings:
  fallbacks:
  - oci-gpt5-mini:
    - oci-grok
    - oci-cohere-command
  - oci-grok:
    - oci-cohere-command


# Gateway-wide settings. ``drop_params`` strips OpenAI kwargs the
# upstream provider doesn't accept (e.g. ``parallel_tool_calls`` on
# Cohere) so cross-vendor agent loops don't 400. ``set_verbose`` is
# kept off here; flip it on for debugging.
litellm_settings:
  drop_params: true
  set_verbose: false
  # Observability — uncomment one or more once you have the backend wired:
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]
  # cache: true
  # cache_params:
  #   type: redis
  #   host: redis
  #   port: 6379


# Master key for the admin API (used by /key/generate to issue
# per-team virtual keys). Treat as a secret. In production, mount via
# Kubernetes secrets or OCI Vault rather than baking it into the image.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Postgres backing for virtual keys + spend logs.
  # Comment out for stateless local-dev mode.
  # database_url: os.environ/DATABASE_URL
