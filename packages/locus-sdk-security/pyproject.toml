[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locus-sdk-security"
# Released in lockstep with locus-sdk: bump this, and the locus-sdk floor
# below, together with the core version.
version = "5.3.0"
description = "Security-domain tooling for Locus agents — AI red-team probes, SOC triage, threat-intel / SIEM / EDR / scanner / fingerprint adapters, OCI cloud posture, and IR playbooks, all grounded through the locus-sdk control core."
readme = "README.md"
license = "UPL-1.0"
license-files = ["LICENSE", "LICENSE.txt"]
requires-python = ">=3.11"
authors = [
    { name = "Oracle and/or its affiliates" },
]
keywords = [
    "security",
    "cybersecurity",
    "red-team",
    "ai-red-teaming",
    "soc",
    "incident-response",
    "threat-intelligence",
    "siem",
    "edr",
    "owasp",
    "mitre-atlas",
    "agents",
    "locus",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Universal Permissive License (UPL)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

# The intel / SIEM / EDR / fingerprint adapters run their live paths on the
# core httpx dependency and the scanner uses only the stdlib, so the full
# read-only triage loop works on locus-sdk alone (offline samples need
# nothing). Cloud posture runs on the core describe_oci / use_oci tools,
# which need the ``oci`` SDK from ``locus-sdk[oci]``.
dependencies = [
    "locus-sdk>=5.3.0",
]

[project.urls]
Homepage = "https://github.com/oracle/locus"
Documentation = "https://locusagents.ai/"
Repository = "https://github.com/oracle/locus"
Issues = "https://github.com/oracle/locus/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/locus_security"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

# Inside this repo, resolve locus-sdk from the workspace root rather than
# PyPI (uv workspace; see [tool.uv.workspace] in the root pyproject.toml).
[tool.uv.sources]
locus-sdk = { workspace = true }
