# GitHub secret scanning configuration.
#
# The Ed25519 key pairs under conformance/v1/audit/keys/ are published test
# vectors (see conformance/v1/README.md): they are derived from a seed in
# scripts/conformance_export.py, sign the fixture audit trails and nothing
# else, and must never be used outside them. The private-key pattern flags
# them on every commit that touches the directory, so they are excluded here.
# Everything else, including tests/ and examples/, stays scanned.
paths-ignore:
  - "conformance/v1/audit/keys/**"
