name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml

  test:
    name: Test
    uses: ./.github/workflows/_test.yml

  integration:
    name: Integration
    uses: ./.github/workflows/_integration.yml
    secrets: inherit

  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/_secrets.yml
    secrets: inherit

  precommit:
    name: Pre-commit
    uses: ./.github/workflows/_precommit.yml

  # Verify commits are signed off (OCA / DCO compliance). Inline bash
  # check — replaces ``tisonkun/actions-dco`` which was deprecated by
  # GitHub for using Node 16 (caused startup_failure on every CI run).
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          echo "Checking commits between $BASE_SHA and $HEAD_SHA"
          missing=$(git log --no-merges --pretty='%H %s' "$BASE_SHA..$HEAD_SHA" \
            | while read sha _subject; do
                if ! git log -1 --pretty='%B' "$sha" \
                    | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
                  printf '%s\n' "$sha"
                fi
              done)
          if [ -n "$missing" ]; then
            echo "::error::The following commits are missing a Signed-off-by line:"
            echo "$missing" | while read sha; do
              echo "  - $(git log -1 --pretty='%h %s' "$sha")"
            done
            echo
            echo "Add a sign-off with: git commit -s --amend --no-edit"
            echo "and then force-push the branch."
            exit 1
          fi
          echo "All commits are signed off."

  # Build the AgentServer deployment image on every PR — the Dockerfile was
  # never exercised by CI before, so image breakage only surfaced at deploy
  # time. Build only: no push, no registry login. A single linux/amd64 build
  # (the runner's native arch, no QEMU) is enough as a gate even though
  # deploys target arm64. Deliberately NOT in the ci-success needs yet —
  # promote it into the aggregate gate once it has proven green on main.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: docker build (linux/amd64, no push)
        run: docker build -t locus-sdk:ci .

  # The documentation's own tests (tests/docs): the Codex skill names the
  # SDK's public surface and its snippets import, the mkdocs hooks behave,
  # notebook pages and release notes render. They need the docs toolchain,
  # which the unit matrix does not install (mkdocs's watchdog has no 3.14
  # wheel), so they get one Python 3.12 job. The docs workflow cannot carry
  # them: its pull_request trigger ignores src/ and the skill directory,
  # which is where the drift these tests catch begins.
  docs-tests:
    name: Docs Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python@v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locus, the test deps and the docs toolchain
        # ``telemetry`` because notebook 60's captured output records spans.
        run: |
          pip install -U pip
          pip install -e ".[dev,docs,openai,telemetry]"

      - name: Run the documentation tests
        run: pytest tests/docs

      - name: Check the captured notebook output still matches a real run
        # The output blocks on the notebook pages are captured from the
        # notebooks; this fails when a notebook's output changed and the
        # page did not (refresh with ``python scripts/notebook_output.py --update``).
        env:
          LOCUS_SDK_DIR: ${{ github.workspace }}
          LOCUS_MODEL_PROVIDER: mock
        run: python scripts/notebook_output.py --check

  # Aggregate gate. Branch-protection should require this single status
  # check rather than each individual one — that lets us add / remove
  # jobs without retouching protection rules.
  ci-success:
    name: CI Success
    needs: [lint, test, integration, secret-scan, precommit, dco, docs-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -eu
          echo "$NEEDS_JSON"
          if echo "$NEEDS_JSON" | grep -qE '"result":[[:space:]]*"(failure|cancelled)"'; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed."
