name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Default to read-only. Individual publishing jobs declare the scopes they
# actually need (id-token for PyPI trusted publishing in future; none of
# these jobs currently need contents: write).
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  HATCH_VERSION: "1.16.5"

jobs:
  # Releases are cut from tagged commits that already passed the full
  # `ci.yml` matrix (lint + tests on Python 3.11–3.14 + pre-commit + DCO).
  # Re-running a single-version `hatch run test` here was redundant, so
  # the release pipeline starts at `build`.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pkg-name: ${{ steps.check-version.outputs.pkg-name }}
      version: ${{ steps.check-version.outputs.version }}
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python@v6.2.0
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Hatch
        run: pip install hatch==${{ env.HATCH_VERSION }}

      # Only tulip-agents (root) is published. tulip-agents-security
      # (packages/) is built into its own directory so pre-release-checks can
      # prove the two still install together, but it is never uploaded: it is
      # not published to PyPI.
      - name: Build project for distribution
        run: |
          hatch build
          cd packages/tulip-agents-security && hatch build ../../dist-security

      # actions/upload-artifact@v7.0.1
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

      # actions/upload-artifact@v7.0.1
      - name: Upload security build (checks only, never published)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-security
          path: dist-security/

      - name: Check Version
        id: check-version
        run: |
          echo "pkg-name=tulip-agents" >> "$GITHUB_OUTPUT"
          echo "version=$(hatch version)" >> "$GITHUB_OUTPUT"

  test-pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC: mint a short-lived token for PyPI Trusted Publishing — no
      # long-lived TEST_PYPI_TOKEN secret to leak, expire, or rotate.
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/${{ needs.build.outputs.pkg-name }}/
    steps:
      # actions/download-artifact@v8.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish@v1.14.2 — Trusted Publishing (OIDC).
      # Requires a trusted publisher registered on test.pypi.org for
      # tulip-agents:
      #   repo=tuliplabs-ai/tulip-agents, workflow=_release.yml, environment=testpypi
      # continue-on-error so a TestPyPI hiccup never blocks the prod publish;
      # skip-existing tolerates re-runs over an already-uploaded version.
      - name: Publish to TestPyPI
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  pre-release-checks:
    needs:
      - build
      - test-pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python@v6.2.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Import published package
        # Download the built artifacts and verify the package imports
        # correctly using the local wheel (no TestPyPI dependency).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      - name: Download security build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-security
          path: dist-security/
      - name: Verify package imports
        env:
          PKG_NAME: ${{ needs.build.outputs.pkg-name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          # Install the wheels directly from the build artifacts: the core
          # alone first (it must not need the security package), then both.
          pip install "dist/${PKG_NAME//-/_}-${VERSION}-py3-none-any.whl"
          python -c "import tulip, tulip.control; print(dir(tulip))"
          pip install "dist-security/tulip_agents_security-${VERSION}-py3-none-any.whl"
          python -c "import tulip_security; from tulip.security import red_team; print(tulip_security.__name__)"

  publish:
    needs:
      - build
      - test-pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC: mint a short-lived token for PyPI Trusted Publishing — no
      # long-lived PYPI_TOKEN secret to leak, expire, or rotate.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.pkg-name }}
    steps:
      # actions/download-artifact@v8.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish@v1.14.2 — Trusted Publishing (OIDC).
      # Requires a trusted publisher on pypi.org for tulip-agents:
      #   repo=tuliplabs-ai/tulip-agents, workflow=_release.yml, environment=pypi
      # dist/ holds tulip-agents only; tulip-agents-security is not published.
      #
      # Moved off v1.14.0 on 2026-08-12: `requires = ["hatchling"]` is unpinned,
      # so the build machine picked up a hatchling that emits
      # `Metadata-Version: 2.5`, and v1.14.0's bundled twine refused it —
      #   InvalidDistribution: '2.5' is not a valid metadata version
      # The 2.5.0 release failed on this AFTER the tag was published, which is
      # the worst moment to find out. TestPyPI would have caught it first if
      # that step were not `continue-on-error` — it failed there too, silently.
      # skip-existing: a re-run after a partial upload (sdist but not wheel)
      # must not trip over the file already published.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          skip-existing: true
