apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "locus-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "locus-agent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "locus-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "locus-agent.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "locus-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.oci.workloadIdentity }}
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            {{- $authType := .Values.env.LOCUS_OCI_AUTH_TYPE | default (ternary "oke_workload_identity" "instance_principal" .Values.oci.workloadIdentity) }}
            - name: LOCUS_OCI_AUTH_TYPE
              value: {{ $authType | quote }}
            - name: OCI_AUTH_TYPE
              value: {{ .Values.env.OCI_AUTH_TYPE | default $authType | quote }}
            {{- range $name, $value := omit .Values.env "LOCUS_OCI_AUTH_TYPE" "OCI_AUTH_TYPE" }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.oci.workloadIdentity }}
            - name: OCI_RESOURCE_PRINCIPAL_VERSION
              value: "2.2"
            - name: OCI_RESOURCE_PRINCIPAL_REGION
              value: {{ required "oci.region is required with workload identity" .Values.oci.region | quote }}
            {{- end }}
            {{- if .Values.serverApiKey.existingSecret }}
            - name: LOCUS_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serverApiKey.existingSecret }}
                  key: {{ .Values.serverApiKey.key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
