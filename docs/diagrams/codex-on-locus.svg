<?xml version="1.0" encoding="UTF-8"?>
<!--
  Codex on Locus, as the repository wires it:
    you -> Codex            `locus codex run "task"` (locus/codex/__init__.py, locus/cli.py): installs the
                            skill into .agents/skills/locus when ~/.agents/skills/locus does not hold it,
                            adds a Locus section to AGENTS.md, then execs codex with the sandbox settings
    Codex -> the skill      Codex discovers .agents/skills/<name>/SKILL.md at the project root and in
                            ~/.agents/skills, and AGENTS.md at the root; the skill is in the wheel
                            (pyproject force-include .agents/skills/locus -> locus/codex/skill)
    Codex -> its model      OpenAI by default; with examples/codex-on-oci a loopback LiteLLM gateway
                            translates the Responses API to chat completions and signs with an OCI
                            profile, so Codex's own model is OCI Generative AI (codex -p oci)
    Codex -> your project   the agent, its tests and a run script, written from the skill
    project -> provider     the agent calls its own model with an oci:, openai: or anthropic: id; the
                            credential comes from the environment or ~/.oci/config (locus/models/registry.py)
    scenarios -> Codex      codex/scenarios/run.py starts `locus codex run --exec` once per task in an
                            empty directory and runs the task's check.sh in what Codex built
  Styled by the .tl-dia classes in docs/stylesheets/locus.css; see docs/diagrams/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="title desc">
  <title id="title">Codex on Locus</title>
  <desc id="desc">You start Codex with the locus codex command, which places the Locus skill next to the project. Codex reads the skill and AGENTS.md, thinks with its own model, OpenAI or OCI Generative AI through the gateway example, and writes and runs your project: the agent, its tests and a run script. The agent then calls its own model provider with an oci, openai or anthropic id, with the credential read from the environment or the OCI configuration file. The scenario series starts Codex the same way once per task in an empty directory and checks what it built.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <g class="lane">
    <rect x="16" y="16" width="188" height="360" rx="14"/>
    <text class="lane-title" x="32" y="40">You</text>
  </g>
  <g class="lane">
    <rect x="244" y="16" width="204" height="360" rx="14"/>
    <text class="lane-title" x="260" y="40">Codex</text>
  </g>
  <g class="lane">
    <rect x="488" y="16" width="192" height="360" rx="14"/>
    <text class="lane-title" x="504" y="40">Your project</text>
  </g>
  <g class="lane">
    <rect x="720" y="16" width="184" height="360" rx="14"/>
    <text class="lane-title" x="736" y="40">Models</text>
  </g>

  <!-- locus codex run -> Codex -->
  <path class="edge" marker-end="url(#ah)" d="M190,149 H262"/>
  <rect class="label-bg" x="195" y="160" width="62" height="20" rx="4"/>
  <text class="label" x="226" y="170">the task</text>

  <!-- scenario series -> Codex: one task per empty directory -->
  <path class="edge dashed" marker-end="url(#ah)" d="M190,279 C224,279 228,166 262,166"/>
  <rect class="label-bg" x="195" y="206" width="62" height="20" rx="4"/>
  <text class="label" x="226" y="216">per task</text>

  <!-- Codex -> the skill -->
  <path class="edge" marker-end="url(#ah)" d="M346,178 V296"/>
  <rect class="label-bg on-lane" x="322" y="226" width="48" height="20" rx="4"/>
  <text class="label" x="346" y="236">reads</text>

  <!-- Codex -> your project -->
  <path class="edge" marker-end="url(#ah)" d="M430,149 H504"/>
  <rect class="label-bg" x="440" y="160" width="54" height="20" rx="4"/>
  <text class="label" x="467" y="170">builds</text>

  <!-- Codex -> its own model, routed above the project -->
  <path class="edge" marker-end="url(#ah)" d="M430,130 C480,36 700,36 736,129"/>
  <rect class="label-bg" x="535" y="46" width="100" height="20" rx="4"/>
  <text class="label" x="585" y="56">its own model</text>

  <!-- Codex -> OCI Generative AI through the gateway, routed below the project -->
  <path class="edge dashed" marker-end="url(#ah)" d="M430,170 C480,232 700,232 732,209"/>
  <rect class="label-bg" x="612" y="214" width="104" height="20" rx="4"/>
  <text class="label" x="664" y="224">via the gateway</text>

  <!-- your project -> the agent's model provider -->
  <path class="edge" marker-end="url(#ah)" d="M584,178 V289 H736"/>
  <rect class="label-bg on-lane" x="596" y="262" width="78" height="20" rx="4"/>
  <text class="label" x="635" y="272">agent's call</text>

  <g class="node primary">
    <rect x="30" y="120" width="160" height="58" rx="12"/>
    <text x="110" y="139">locus codex run</text>
    <text class="sub" x="110" y="160">places the skill</text>
  </g>
  <g class="node optional">
    <rect x="30" y="250" width="160" height="58" rx="12"/>
    <text x="110" y="269">Scenario series</text>
    <text class="sub" x="110" y="290">a task and a check</text>
  </g>

  <g class="node">
    <rect x="262" y="120" width="168" height="58" rx="12"/>
    <text x="346" y="139">Codex</text>
    <text class="sub" x="346" y="160">reads the house rules</text>
  </g>
  <g class="store">
    <path d="M262,306 A84,9 0 0 1 430,306 V352 A84,9 0 0 1 262,352 Z M262,306 A84,9 0 0 0 430,306"/>
    <g class="node">
      <text x="346" y="325">The Locus skill</text>
      <text class="sub" x="346" y="346">SKILL.md · references</text>
    </g>
  </g>

  <g class="node">
    <rect x="504" y="120" width="160" height="58" rx="12"/>
    <text x="584" y="139">Your project</text>
    <text class="sub" x="584" y="160">agent · tests · run</text>
  </g>

  <g class="node">
    <rect x="736" y="100" width="152" height="58" rx="12"/>
    <text x="812" y="119">OpenAI</text>
    <text class="sub" x="812" y="140">Codex's own model</text>
  </g>
  <g class="node optional">
    <rect x="732" y="180" width="160" height="58" rx="12"/>
    <text x="812" y="199">OCI Generative AI</text>
    <text class="sub" x="812" y="220">via the gateway</text>
  </g>
  <g class="node">
    <rect x="736" y="260" width="152" height="58" rx="12"/>
    <text x="812" y="279">Model provider</text>
    <text class="sub" x="812" y="300">the agent's own id</text>
  </g>

  <text class="note" x="460" y="398">Codex learns Locus from the skill, not from the web; credentials stay in the environment or ~/.oci/config.</text>
</svg>
