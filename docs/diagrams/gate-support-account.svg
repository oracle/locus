<?xml version="1.0" encoding="UTF-8"?>
<!--
  The account gate of examples/notebook_73_support_account_gate.py, enforced by locus.control.admit:
    support agent -> admit()    each account change is an Action handed to admit(action, perform, policy=policy, trail=trail)  (notebook_73:111-116, :134-139)
                                apply_credit, $5 goodwill credit, blast_radius 1, no tags  (:101-108)
                                upgrade_plan_and_credit, enterprise plan + $500 credit, blast_radius 2 (the plan and the billing balance), tags {high_value}  (:123-129)
    policy                      ControlPolicy(require_verification_score=0.0, max_blast_radius=1, require_human_for={"high_value"})  (:92-96)
                                ControlPolicy is a frozen dataclass of knobs with no methods; approve is the module-level
                                function approve(action, *, policy=...)  (src/locus/control/policy.py:47-79, :143-151)
    allow                       the small credit: no high_value label and 1 <= 1 -> perform() runs apply_account_change, the account is updated  (:72-75)
    hold                        the upgrade: high_value is in require_human_for and 2 > 1, both rules fire -> require_human; AdmissionError, the account is untouched  (:141-149)
    trail                       both decisions recorded, "allow" and "require_human", trail.verify() True  (:154-163)
    admit()   -> approve()      _decide() calls approve(action, policy=...) before anything else  (src/locus/control/admission.py:131-142, :203-210)
    approve() -> allow          no rule fired: approve() returns allow when nothing triggered  (policy.py:249-250)
                                labels() = {environment, kind, *tags}  (policy.py:95-97)
    approve() -> hold           a label in require_human_for -> require_human  (policy.py:243-247);
                                blast_radius > max_blast_radius -> require_human  (policy.py:214-220); strongest outcome wins (:256)
    allow -> perform()          admit() awaits perform only after _decide() returned  (admission.py:143)
    hold  -> AdmissionError     raised when the decision is not allowed and no approved_by was given  (admission.py:233-234);
                                it carries the ApprovalDecision (admission.py:62-73)
    both  -> AuditTrail         trail.record("action-admission", {action, asset, outcome, reason}) runs before the raise
                                and before perform  (admission.py:212-232), which is what the second label row on each
                                record edge states; each record is SHA-256 over seq, ts, event_type,
                                payload, prev_hash  (audit.py:82-102, :297-329); trail.verify() walks the chain  (audit.py:344-446)
  Styled by the .tl-dia classes in docs/stylesheets/locus.css; see docs/diagrams/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 506" role="img" aria-labelledby="title desc">
  <title id="title">The account gate</title>
  <desc id="desc">The support agent proposes an account change as an Action and hands it to admit() together with the side effect, the ControlPolicy and the AuditTrail. admit() calls approve(action, policy=...), which weighs the action's labels and blast radius against the policy. A $5 goodwill credit, blast radius 1 with no high_value tag, is allowed: perform() updates the account. A plan upgrade with a $500 credit, tagged high_value and touching the plan and the billing balance (blast radius 2, over the cap of 1), is held: admit() raises AdmissionError, nothing is written, and the change waits for a support lead. Both decisions, allow and require_human, are recorded on the hash-chained AuditTrail before perform() is awaited or the error is raised, and trail.verify() checks the chain.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- agent -> admit() -->
  <path class="edge" marker-end="url(#ah)" d="M184,59 L350,59"/>
  <rect class="label-bg" x="213" y="70" width="108" height="20" rx="4"/>
  <text class="label" x="267" y="80">account change</text>

  <!-- admit() -> approve(action, policy=...) -->
  <path class="edge" marker-end="url(#ah)" d="M470,88 L470,122"/>

  <!-- approve() -> allow -->
  <path class="edge allow" marker-end="url(#ah)" d="M358,172 L156,172 Q144,172 144,184 L144,256"/>
  <rect class="label-bg" x="168" y="128" width="166" height="20" rx="4"/>
  <text class="label" x="251" y="138">allow: $5 goodwill credit</text>
  <rect class="label-bg" x="156" y="148" width="190" height="20" rx="4"/>
  <text class="label" x="251" y="158">blast radius 1, not high_value</text>

  <!-- approve() -> hold (require_human) -->
  <path class="edge hold" marker-end="url(#ah)" d="M582,172 L784,172 Q796,172 796,184 L796,256"/>
  <rect class="label-bg" x="581" y="128" width="216" height="20" rx="4"/>
  <text class="label" x="689" y="138">hold: plan upgrade + $500 credit</text>
  <rect class="label-bg" x="582" y="148" width="214" height="20" rx="4"/>
  <text class="label" x="689" y="158">high_value tag, blast radius 2 > 1</text>

  <!-- allow -> AuditTrail: the record happens before perform() is awaited -->
  <path class="edge" marker-end="url(#ah)" d="M264,287 L368,287 Q380,287 380,299 L380,376"/>
  <rect class="label-bg" x="323" y="313" width="114" height="20" rx="4"/>
  <text class="label" x="380" y="323">recorded: allow</text>
  <rect class="label-bg" x="305" y="335" width="150" height="20" rx="4"/>
  <text class="label" x="380" y="345">before perform() runs</text>

  <!-- hold -> AuditTrail: the record happens before AdmissionError is raised -->
  <path class="edge" marker-end="url(#ah)" d="M676,287 L572,287 Q560,287 560,299 L560,376"/>
  <rect class="label-bg" x="477" y="313" width="166" height="20" rx="4"/>
  <text class="label" x="560" y="323">recorded: require_human</text>
  <rect class="label-bg" x="501" y="335" width="118" height="20" rx="4"/>
  <text class="label" x="560" y="345">before the raise</text>

  <g class="node">
    <rect x="24" y="30" width="160" height="58" rx="12"/>
    <text x="104" y="49">Support agent</text>
    <text class="sub" x="104" y="70">proposes an Action</text>
  </g>
  <g class="node primary">
    <rect x="352" y="30" width="236" height="58" rx="12"/>
    <text x="470" y="49">admit()</text>
    <text class="sub" x="470" y="70">action, perform, policy, trail</text>
  </g>
  <g class="decision node">
    <polygon points="470,124 582,172 470,220 358,172"/>
    <text x="470" y="162">approve()</text>
    <text class="sub" x="470" y="183">action, policy</text>
  </g>
  <g class="node allow">
    <rect x="24" y="258" width="240" height="58" rx="12"/>
    <text x="144" y="277">allow</text>
    <text class="sub" x="144" y="298">perform() updates the account</text>
  </g>
  <g class="node hold">
    <rect x="676" y="258" width="240" height="58" rx="12"/>
    <text x="796" y="277">hold</text>
    <text class="sub" x="796" y="298">AdmissionError, nothing written</text>
  </g>
  <g class="store node">
    <path d="M350,384 A120,9 0 0 1 590,384 V436 A120,9 0 0 1 350,436 Z M350,384 A120,9 0 0 0 590,384"/>
    <text x="470" y="403">AuditTrail</text>
    <text class="sub" x="470" y="424">every decision, hash-chained</text>
  </g>

  <text class="note" x="470" y="472">ControlPolicy(require_verification_score=0.0, max_blast_radius=1, require_human_for={"high_value"})</text>
  <text class="note" x="470" y="492">admit() records the decision before it awaits perform() or raises; trail.verify() checks the SHA-256 chain.</text>
</svg>
