<?xml version="1.0" encoding="UTF-8"?>
<!--
  OCI GenAI Sandboxes card: the agent's process on the left, a process
  boundary, and on the right the sandbox (the subject): an isolated runtime
  the harness commands run in, and the /workspace files beside it. The edge
  is dashed because it crosses the boundary: every command and file goes over
  the OCI Generative AI Sandbox API.
  locus/harness/oci_sandbox.py: OCISandboxSession (run, upload_file, download_file),
  OCISandboxBackend (create, connect, extend, close)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 56">
  <title>An agent reaching across a process boundary into a sandbox band that holds the runtime and the workspace files</title>
  <defs><marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path class="arrowhead" d="M0,0 L6,3 L0,6 z"/></marker></defs>
  <g class="node"><rect x="4" y="21" width="22" height="14" rx="3"/></g>
  <path class="divider" d="M38,4 L38,52"/>
  <path class="edge dashed" marker-end="url(#ah)" d="M26,28 L50,28"/>
  <g class="lane"><rect x="52" y="6" width="40" height="44" rx="4"/></g>
  <g class="node primary"><rect x="58" y="12" width="28" height="12" rx="3"/></g>
  <g class="store"><path d="M64,32 C64,29.5 80,29.5 80,32 L80,42 C80,44.5 64,44.5 64,42 Z M64,32 C64,34.5 80,34.5 80,32"/></g>
</svg>
