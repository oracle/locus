<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 920" role="img" aria-labelledby="title desc">
  <title id="title">Locus behind the LiteLLM AI Gateway in front of Oracle Generative AI Infrastructure</title>
  <desc id="desc">A Locus agent uses its existing OpenAIModel pointed at a LiteLLM AI Gateway. The gateway carries virtual keys, fallback chains, observability, cost tracking, caching, guardrails, and auditing. The gateway signs the upstream call into OCI Generative AI Infrastructure with OCI Signature v1. The same gateway also fronts OpenAI direct, Anthropic, AWS Bedrock, Google Vertex, and Ollama.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .h-eyebrow   { font: 400 13px "Inter", -apple-system, "Segoe UI", sans-serif; fill: #3D3D3A; }
    .h-title     { font: 600 18px "Inter", -apple-system, "Segoe UI", sans-serif; fill: #141413; }
    .lane-title  { font: 600 15px "Inter", -apple-system, "Segoe UI", sans-serif; }
    .lane-sub    { font: 400 12px "Inter", -apple-system, "Segoe UI", sans-serif; }
    .mono        { font: 500 12px "JetBrains Mono", "SF Mono", "Menlo", monospace; }
    .mono-sm     { font: 500 11px "JetBrains Mono", "SF Mono", "Menlo", monospace; }
    .arrow-label { font: 500 12px "Inter", -apple-system, "Segoe UI", sans-serif; fill: #5F5E5A; }
    .feature-key { font: 600 12px "Inter", -apple-system, "Segoe UI", sans-serif; fill: #3C3489; }
    .feature     { font: 400 12px "Inter", -apple-system, "Segoe UI", sans-serif; fill: #444441; }
    .credential  { font: 400 12px "Inter", -apple-system, "Segoe UI", sans-serif; fill: #5F5E5A; }
  </style>

  <!-- Headings -->
  <text x="490" y="30" text-anchor="middle" class="h-eyebrow">Architecture</text>
  <text x="490" y="58" text-anchor="middle" class="h-title">Locus → LiteLLM AI Gateway → Oracle Generative AI Infrastructure</text>
  <line x1="400" y1="70" x2="580" y2="70" stroke="#A32D2D" stroke-width="1.5"/>

  <!-- =================== TIER 1 — Locus agent =================== -->
  <rect x="60" y="100" width="860" height="160" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
  <text x="80" y="132" class="lane-title" style="fill:#444441;">Locus agent</text>
  <text x="80" y="154" class="lane-sub" style="fill:#5F5E5A;">No OCI credentials. No new model class. Just the existing OpenAI-compatible client.</text>

  <!-- Code block — proper multi-line layout via separate <text> elements -->
  <rect x="170" y="170" width="640" height="78" rx="6" fill="#FFFFFF" stroke="#8C9AC0" stroke-width="0.5"/>
  <text x="190" y="192" class="mono" style="fill:#1A1A1A;">OpenAIModel(</text>
  <text x="210" y="210" class="mono" style="fill:#1A1A1A;">
    <tspan fill="#3C3489">model</tspan><tspan>    = </tspan><tspan fill="#0A6D2B">"oci-cohere-command",</tspan>
  </text>
  <text x="210" y="226" class="mono" style="fill:#1A1A1A;">
    <tspan fill="#3C3489">base_url</tspan><tspan> = </tspan><tspan fill="#0A6D2B">"http://litellm-gateway:4000",</tspan>
  </text>
  <text x="210" y="242" class="mono" style="fill:#1A1A1A;">
    <tspan fill="#3C3489">api_key</tspan><tspan>  = </tspan><tspan fill="#0A6D2B">"&lt;gateway-virtual-key&gt;",</tspan>
  </text>
  <text x="190" y="258" class="mono" style="fill:#1A1A1A;">)</text>

  <!-- Arrow Locus -> Gateway -->
  <text x="490" y="288" text-anchor="middle" class="arrow-label">OpenAI Chat Completions over HTTPS · Bearer &lt;virtual-key&gt;</text>
  <line x1="490" y1="296" x2="490" y2="320" stroke="#3C3489" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- =================== TIER 2 — LiteLLM Gateway =================== -->
  <rect x="60" y="326" width="860" height="368" rx="14" fill="#EEEDFE" fill-opacity="0.95" stroke="#534AB7" stroke-width="1.2"/>
  <text x="80" y="358" class="lane-title" style="fill:#3C3489;">LiteLLM AI Gateway</text>
  <text x="80" y="378" class="lane-sub" style="fill:#534AB7;">
    <tspan class="mono-sm" style="fill:#534AB7;">litellm --config config.yaml</tspan>
    <tspan>  ·  pod / container / sidecar — operated by your platform team</tspan>
  </text>

  <!-- Feature grid: 2 columns x 4 rows (tile=400x54, gap=12, indent=20) -->
  <g transform="translate(80, 400)">
    <!-- Row 1 -->
    <rect x="0"   y="0"   width="400" height="54" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.4"/>
    <text x="16"  y="22"  class="feature-key">Virtual keys</text>
    <text x="16"  y="42"  class="feature">per-team budgets · RPM/TPM · expiry · model allowlists</text>

    <rect x="420" y="0"   width="400" height="54" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.4"/>
    <text x="436" y="22"  class="feature-key">Fallback chains</text>
    <text x="436" y="42"  class="feature">oci-gpt5-mini → oci-grok → oci-cohere-command</text>

    <!-- Row 2 -->
    <rect x="0"   y="66"  width="400" height="54" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.4"/>
    <text x="16"  y="88"  class="feature-key">Observability</text>
    <text x="16"  y="108" class="feature">Langfuse · OpenTelemetry · Datadog · Helicone</text>

    <rect x="420" y="66"  width="400" height="54" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.4"/>
    <text x="436" y="88"  class="feature-key">Cost tracking</text>
    <text x="436" y="108" class="feature">Postgres — per-key / per-team / per-model spend</text>

    <!-- Row 3 -->
    <rect x="0"   y="132" width="400" height="54" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.4"/>
    <text x="16"  y="154" class="feature-key">Cache</text>
    <text x="16"  y="174" class="feature">Redis · S3 · Qdrant  (semantic + exact match)</text>

    <rect x="420" y="132" width="400" height="54" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.4"/>
    <text x="436" y="154" class="feature-key">Guardrails</text>
    <text x="436" y="174" class="feature">Lakera · Aporia · Presidio · Bedrock Guardrails</text>

    <!-- Row 4 -->
    <rect x="0"   y="198" width="400" height="54" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.4"/>
    <text x="16"  y="220" class="feature-key">Audit</text>
    <text x="16"  y="240" class="feature">every request, response, tool call, stream chunk</text>

    <rect x="420" y="198" width="400" height="54" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.4"/>
    <text x="436" y="220" class="feature-key">Admin UI</text>
    <text x="436" y="240" class="feature">spend dashboards · virtual-key management</text>
  </g>

  <!-- Credential boundary note — two lines, well clear of the feature grid below
       (grid ends at y=400+252=652; note starts at y=666). -->
  <text x="80" y="666" class="credential">
    OCI Signature v1 RSA-SHA256 signing happens here, not in Locus.
  </text>
  <text x="80" y="684" class="credential">
    OCI credentials live in the gateway pod via OCI Vault or OKE Workload Identity — never on disk in any Locus service.
  </text>

  <!-- Arrow Gateway -> OCI -->
  <text x="490" y="720" text-anchor="middle" class="arrow-label">signed HTTPS · OCI Signature v1</text>
  <line x1="490" y1="728" x2="490" y2="752" stroke="#A32D2D" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =================== TIER 3 — OCI Generative AI =================== -->
  <rect x="60" y="758" width="860" height="138" rx="14" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
  <text x="80" y="790" class="lane-title" style="fill:#791F1F;">Oracle Generative AI Infrastructure</text>

  <text x="80" y="814" class="mono-sm" style="fill:#A32D2D;">/20231130/actions/chat</text>
  <text x="290" y="814" class="lane-sub" style="fill:#A32D2D;">·</text>
  <text x="305" y="814" class="mono-sm" style="fill:#A32D2D;">/openai/v1/chat/completions</text>
  <text x="555" y="814" class="lane-sub" style="fill:#A32D2D;">·</text>
  <text x="570" y="814" class="mono-sm" style="fill:#A32D2D;">/openai/v1/responses</text>

  <text x="80" y="842" class="feature">Llama  ·  Grok  ·  Cohere Command  ·  Cohere Embed  ·  Google Gemini  ·  OpenAI gpt-5</text>
  <text x="80" y="876" class="feature" style="fill:#5F5E5A;">
    Same gateway also fronts:  OpenAI direct  ·  Anthropic  ·  AWS Bedrock  ·  Google Vertex AI  ·  Ollama  ·  100+ providers
  </text>
</svg>
